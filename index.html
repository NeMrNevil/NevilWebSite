const ctx = canvas.getContext('2d');
let w, h, time = 0;
let particles = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  const count = Math.min(180, Math.max(70, Math.floor((w * h) / 12000)));
  particles = Array.from({ length: count }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    r: Math.random() * 1.8 + 0.4,
    a: Math.random() * 0.6 + 0.15,
    phase: Math.random() * Math.PI * 2
  }));
}

function draw() {
  time += 0.006;
  ctx.clearRect(0, 0, w, h);

  // Soft moving glows filling the entire viewport
  const glows = [
    { x: w * 0.18 + Math.sin(time * 0.7) * w * 0.08, y: h * 0.25 + Math.cos(time) * h * 0.08, r: Math.max(w,h) * 0.34, a: 0.055 },
    { x: w * 0.82 + Math.cos(time * 0.55) * w * 0.09, y: h * 0.72 + Math.sin(time * 0.8) * h * 0.08, r: Math.max(w,h) * 0.38, a: 0.045 },
    { x: w * 0.52 + Math.sin(time * 0.35) * w * 0.12, y: h * 0.48 + Math.cos(time * 0.6) * h * 0.12, r: Math.max(w,h) * 0.28, a: 0.035 }
  ];

  glows.forEach(g => {
    const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
    grad.addColorStop(0, `rgba(255,255,255,${g.a})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

  // Floating particles over the whole screen

    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -10) p.x = w + 10;
    if (p.x > w + 10) p.x = -10;
    if (p.y < -10) p.y = h + 10;
    if (p.y > h + 10) p.y = -10;

    const pulse = 0.55 + Math.sin(time * 1.5 + p.phase) * 0.45;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.a * pulse})`;
    ctx.fill();

  // Thin animated connections between nearby particles
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
  }

    ctx.beginPath();
    ctx.strokeStyle = `rgba(255,255,255,${0.025 + i * 0.012})`;
    ctx.lineWidth = 1.2;

        + Math.sin(x * 0.009 - time * 0.6) * 22;
      if (x === -80) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  requestAnimationFrame(draw);

<script>
(function () {
  const music = document.getElementById("bgMusic");
  const button = document.getElementById("soundButton");
  const slider = document.getElementById("volumeSlider");

  if (!music || !button || !slider) return;

  music.volume = 0.30;

  function updateIcon() {
    if (music.paused || music.volume === 0) {
      button.textContent = "🔇";
    } else if (music.volume < 0.5) {
      button.textContent = "🔉";
    } else {
      button.textContent = "🔊";
    }
  }

  function startMusic() {
    music.play().catch(() => {});
    updateIcon();
  }

  // Музыка запускается после клика по "click to enter".
  document.getElementById("overlay").addEventListener("click", startMusic);

  // Запасной вариант: первый клик в любом месте.
  document.addEventListener("click", startMusic, { once: true });

  button.addEventListener("click", function (event) {
    event.stopPropagation();

    if (music.paused) {
      music.play().catch(() => {});
    } else {
      music.pause();
    }

    updateIcon();
  });

  slider.addEventListener("input", function () {
    music.volume = Number(this.value);

    if (music.volume > 0 && music.paused === false) {
      button.textContent = music.volume < 0.5 ? "🔉" : "🔊";
    } else if (music.volume === 0) {
      button.textContent = "🔇";
    }
  });

  music.addEventListener("ended", function () {
    // Без loop музыка просто заканчивается.
    button.textContent = "🔇";
  });

  updateIcon();
})();
</script>


<script>
(function(){
  // 1. Entrance animation
  function revealPage(){
    document.body.classList.add("page-ready");
  }

  const overlay = document.getElementById("overlay");
  if (overlay) {
    overlay.addEventListener("click", function(){
      setTimeout(revealPage, 120);
    }, {once:true});
  } else {
    requestAnimationFrame(revealPage);
  }

  // 2. Interactive particles: cursor repels nearby particles and attracts lines.
  const canvas = document.getElementById("interactiveParticles");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  let w = 0, h = 0, dpr = 1;
  let particles = [];
  const mouse = {x:-9999, y:-9999, active:false};

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w*dpr);
    canvas.height = Math.floor(h*dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const count = Math.min(115, Math.max(45, Math.floor((w*h)/15000)));
    particles = Array.from({length:count}, () => ({
      x:Math.random()*w,
      y:Math.random()*h,
      vx:(Math.random()-.5)*.35,
      vy:(Math.random()-.5)*.35,
      r:Math.random()*1.5+.6
    }));
  }

  function move(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("pointermove", move, {passive:true});
  window.addEventListener("pointerleave", ()=>mouse.active=false);

  function frame(){
    ctx.clearRect(0,0,w,h);

    for(let i=0;i<particles.length;i++){
      const p = particles[i];

      p.x += p.vx;
      p.y += p.vy;

      if(p.x < -20) p.x = w+20;
      if(p.x > w+20) p.x = -20;
      if(p.y < -20) p.y = h+20;
      if(p.y > h+20) p.y = -20;

      if(mouse.active){
        const dx = p.x-mouse.x;
        const dy = p.y-mouse.y;
        const dist = Math.hypot(dx,dy);
        const radius = 125;
        if(dist < radius && dist > 0){
          const force = (1-dist/radius) * .55;
          p.x += (dx/dist)*force;
          p.y += (dy/dist)*force;
        }
      }

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.62)";
      ctx.fill();
    }

    // Connecting lines
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a=particles[i], b=particles[j];
        const dx=a.x-b.x, dy=a.y-b.y;
        const dist=Math.hypot(dx,dy);
        if(dist < 115){
          const alpha=(1-dist/115)*.14;
          ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }

    // Soft cursor glow
    if(mouse.active){
      const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,150);
      g.addColorStop(0,"rgba(255,255,255,.075)");
      g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=g;
      ctx.fillRect(mouse.x-150,mouse.y-150,300,300);
    }

    requestAnimationFrame(frame);
  }

  resize();
  frame();
})();
</script>

</body>
