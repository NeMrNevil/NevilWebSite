<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MrNevil</title>
<style>
  @import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.0/index.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    cursor: default;
    transition: background .5s ease;
    perspective: 1400px;
    border: none;
    outline: none;
  }

  /* ============================================================
     СВЕТЛАЯ ТЕМА
     ============================================================ */
  body.light-theme {
    background: #eef0f4;
  }
  body.light-theme .card {
    background: rgba(255,255,255,.75) !important;
    border: 1px solid rgba(0,0,0,.08) !important;
    box-shadow: 0 18px 55px rgba(0,0,0,.12) !important;
    backdrop-filter: blur(32px) saturate(110%);
    -webkit-backdrop-filter: blur(32px) saturate(110%);
  }
  body.light-theme .name { color: #111; }
  body.light-theme .name:hover { color: rgba(0,0,0,.7); }
  body.light-theme .hint { color: rgba(0,0,0,.4); }
  body.light-theme .socials a {
    background: rgba(0,0,0,.05);
    border-color: rgba(0,0,0,.08);
  }
  body.light-theme .socials a svg { fill: rgba(0,0,0,.7); }
  body.light-theme .socials a:hover {
    background: rgba(0,0,0,.10) !important;
    border-color: rgba(0,0,0,.22) !important;
  }
  body.light-theme .socials a:hover svg { fill: #000; }
  body.light-theme .avatar-wrap { border-color: rgba(0,0,0,.1); }

  body.light-theme .sound-control,
  body.light-theme .roulette-trigger,
  body.light-theme .theme-toggle {
    background: rgba(255,255,255,.7);
    border-color: rgba(0,0,0,.12);
    color: #111;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  body.light-theme .sound-control:hover,
  body.light-theme .sound-control:focus-within,
  body.light-theme .roulette-trigger:hover,
  body.light-theme .theme-toggle:hover {
    background: rgba(255,255,255,.95);
    border-color: rgba(0,0,0,.22);
    color: #000;
  }
  body.light-theme .sound-button { color: #111; }
  body.light-theme .roulette-trigger svg { fill: rgba(0,0,0,.75); }
  body.light-theme .volume-slider { background: rgba(0,0,0,.18); }
  body.light-theme .volume-slider::-webkit-slider-thumb { background: #111; }
  body.light-theme .volume-slider::-moz-range-thumb { background: #111; }

  body.light-theme .ip-badge {
    background: rgba(255,255,255,.7);
    border-color: rgba(0,0,0,.12);
    color: #111;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  body.light-theme .ip-badge .ip-label { color: rgba(0,0,0,.45); }
  body.light-theme .ip-badge .ip-value { color: #111; }
  body.light-theme .ip-badge .ip-dot { background: #22c55e; }

  body.light-theme .roulette-panel {
    background: rgba(238,240,244,.92);
  }
  body.light-theme .rp-balance { color: rgba(0,0,0,.55); }
  body.light-theme .rp-balance b { color: #111; }
  body.light-theme .rp-table .rp-cell {
    background: rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.10);
    color: #111;
  }
  body.light-theme .rp-cell.red { background: rgba(200,50,60,.75); color: #fff; }
  body.light-theme .rp-cell.black { background: rgba(30,30,36,.9); color: #fff; }
  body.light-theme .rp-cell.green { background: rgba(30,140,80,.75); color: #fff; }
  body.light-theme .rp-cell.side { color: rgba(0,0,0,.7); }
  body.light-theme .rp-cell.bet-red { background: rgba(200,50,60,.75); }
  body.light-theme .rp-cell.bet-black { background: rgba(30,30,36,.9); }
  body.light-theme .rp-wheel-result { color: rgba(0,0,0,.5); }
  body.light-theme .rp-wheel-result b { color: #111; }
  body.light-theme .rp-spin-btn {
    background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.03));
    border-color: rgba(0,0,0,.15);
    color: #111;
  }
  body.light-theme .rp-spin-btn:hover {
    background: linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.06));
    border-color: rgba(0,0,0,.3);
  }
  body.light-theme .rp-bet-info { color: rgba(0,0,0,.5); }
  body.light-theme .rp-bet-info b { color: #111; }
  body.light-theme .rp-footer { color: rgba(0,0,0,.4); }
  body.light-theme .rp-wheel-pointer { border-top-color: #111; }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: block;
    border: 0;
    outline: 0;
  }

  #interactiveParticles {
    border: 0;
    outline: 0;
  }

  .card {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: 420px;
    max-width: 90vw;
    padding: 40px 30px 30px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    text-align: center;
    opacity: 0;
    animation: cardIn 0.8s ease 0.3s forwards;
    transform-style: preserve-3d;
    will-change: transform;
  }
  @keyframes cardIn { to { opacity: 1; } }

  .card-inner {
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform .12s ease-out;
  }

  .avatar-wrap {
    width: 90px; height: 90px;
    margin: 0 auto 16px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
    position: relative;
    transform: translateZ(40px);
  }
  .avatar-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .avatar-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100,220,200,0.15) 0%, transparent 70%);
    animation: pulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.5; }
  }

  .hint {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
    margin-bottom: 4px;
    min-height: 16px;
    transform: translateZ(20px);
  }

  .name {
    font-size: 28px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 24px;
    cursor: default;
    user-select: none;
    transition: color 0.3s;
    transform: translateZ(30px);
  }
  .name:hover { color: rgba(255,255,255,0.85); }

  .socials {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    transform: translateZ(25px);
  }
  .socials a {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.3s ease;
    text-decoration: none;
  }
  .socials a:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-2px);
  }
  .socials a svg {
    width: 18px; height: 18px;
    fill: rgba(255,255,255,0.7);
    transition: fill 0.3s ease;
  }
  .socials a:hover svg { fill: #fff; }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    border: 0;
    outline: 0;
  }
  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .overlay-text {
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    letter-spacing: 2px;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

/* ============================================================
   MUSIC CONTROL — капсула
   ============================================================ */
.sound-control{
  position:fixed;
  top:20px;
  left:20px;
  z-index:9999;
  display:flex;
  align-items:center;
  height:52px;
  padding:0;
  border-radius:26px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow:hidden;
  width:52px;
  transition:width .35s cubic-bezier(.2,.8,.2,1),
             background .25s ease,
             border-color .25s ease,
             box-shadow .25s ease;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
.sound-control:hover,
.sound-control:focus-within{
  width:200px;
  background:rgba(0,0,0,.65);
  border-color:rgba(255,255,255,.28);
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}

.sound-button{
  flex:0 0 52px;
  width:52px;
  height:52px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s ease, transform .2s ease;
  border-radius:26px;
  outline:none;
}
.sound-button:hover{
  background:rgba(255,255,255,.10);
}
.sound-button:active{
  transform:scale(.94);
}

.volume-wrap{
  flex:1;
  display:flex;
  align-items:center;
  padding:0 16px 0 4px;
  min-width:0;
  opacity:0;
  transform:translateX(-8px);
  transition:opacity .2s ease .05s, transform .3s ease .05s;
}
.sound-control:hover .volume-wrap,
.sound-control:focus-within .volume-wrap{
  opacity:1;
  transform:translateX(0);
}

.volume-slider{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:4px;
  border-radius:10px;
  background:rgba(255,255,255,.22);
  outline:none;
  cursor:pointer;
}
.volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#fff;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.45);
  transition:transform .15s ease;
}
.volume-slider::-webkit-slider-thumb:hover{
  transform:scale(1.15);
}
.volume-slider::-moz-range-thumb{
  width:14px;
  height:14px;
  border:0;
  border-radius:50%;
  background:#fff;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.45);
}

/* ============================================================
   THEME TOGGLE
   ============================================================ */
.theme-toggle{
  position:fixed;
  top:84px;
  left:20px;
  z-index:9999;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .25s ease, border-color .25s ease,
             transform .25s ease, box-shadow .25s ease,
             color .25s ease;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  outline:none;
}
.theme-toggle:hover{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.3);
  transform:translateY(-2px) scale(1.05);
}
.theme-toggle:active{
  transform:scale(.94);
}
.theme-toggle svg{
  width:22px;
  height:22px;
  fill:currentColor;
  transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
}
.theme-toggle .icon-sun,
.theme-toggle .icon-moon{
  position:absolute;
  transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
}
.theme-toggle .icon-sun{ opacity:1; transform:rotate(0) scale(1); }
.theme-toggle .icon-moon{ opacity:0; transform:rotate(-90deg) scale(.6); }
body.light-theme .theme-toggle .icon-sun{ opacity:0; transform:rotate(90deg) scale(.6); }
body.light-theme .theme-toggle .icon-moon{ opacity:1; transform:rotate(0) scale(1); }

/* ============================================================
   IP BADGE
   ============================================================ */
.ip-badge{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  display:flex;
  align-items:center;
  gap:10px;
  height:40px;
  padding:0 18px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;
  font-size:13px;
  letter-spacing:1px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  transition:background .3s ease, border-color .3s ease, color .3s ease,
             opacity .4s ease, transform .4s ease;
  opacity:0;
  pointer-events:none;
}
.ip-badge.show{
  opacity:1;
  pointer-events:auto;
}
.ip-badge .ip-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 8px rgba(34,197,94,.8);
  animation:ipPulse 2s ease-in-out infinite;
}
@keyframes ipPulse{
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:.55; transform:scale(.85); }
}
.ip-badge .ip-label{
  color:rgba(255,255,255,.5);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:2px;
  font-weight:500;
}
.ip-badge .ip-value{
  color:#fff;
  font-weight:600;
  font-family:'JetBrains Mono', 'SF Mono', Consolas, monospace;
  letter-spacing:.5px;
}


/* === Extra visual effects === */

body .card{
  opacity:0;
  transform:translate(-50%, calc(-50% + 22px)) scale(.96);
  transition:opacity .8s ease, transform .9s cubic-bezier(.2,.8,.2,1);
}
body.page-ready .card{
  opacity:1;
  transform:translate(-50%, -50%) scale(1);
}
body.page-ready #avatar{
  animation: avatarIntro .9s cubic-bezier(.2,.8,.2,1) .15s both;
}
body.page-ready .socials a{
  animation: socialIntro .55s cubic-bezier(.2,.8,.2,1) both;
}
body.page-ready .socials a:nth-child(1){animation-delay:.25s}
body.page-ready .socials a:nth-child(2){animation-delay:.30s}
body.page-ready .socials a:nth-child(3){animation-delay:.35s}
body.page-ready .socials a:nth-child(4){animation-delay:.40s}
body.page-ready .socials a:nth-child(5){animation-delay:.45s}
body.page-ready .socials a:nth-child(6){animation-delay:.50s}
body.page-ready .socials a:nth-child(7){animation-delay:.55s}
body.page-ready .socials a:nth-child(8){animation-delay:.60s}
body.page-ready .socials a:nth-child(9){animation-delay:.65s}
body.page-ready .socials a:nth-child(10){animation-delay:.70s}

@keyframes avatarIntro{
  from{opacity:0; transform:scale(.72) rotate(-8deg)}
  to{opacity:1; transform:scale(1) rotate(0)}
}
@keyframes socialIntro{
  from{opacity:0; transform:translateY(12px)}
  to{opacity:1; transform:translateY(0)}
}

#interactiveParticles{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-1;
  pointer-events:none;
  transition:opacity .5s ease, transform .4s ease-out;
}
body.light-theme #interactiveParticles { opacity: .35; }

.card{
  background:rgba(0,0,0,.12) !important;
  border:1px solid rgba(255,255,255,.08) !important;
  box-shadow:0 18px 55px rgba(0,0,0,.28) !important;
  backdrop-filter:blur(32px) saturate(110%);
  -webkit-backdrop-filter:blur(32px) saturate(110%);
  transition:background .5s ease, border-color .5s ease, box-shadow .5s ease;
}

.socials a{
  position:relative;
  overflow:hidden;
  transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease,
    filter .25s ease;
}
.socials a::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0);
  border-radius:50%;
  background:rgba(255,255,255,.12);
  filter:blur(12px);
  transition:transform .35s ease;
  pointer-events:none;
}
.socials a:hover{
  transform:translateY(-4px) scale(1.07);
  background:rgba(255,255,255,.10) !important;
  border-color:rgba(255,255,255,.28) !important;
  box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 22px rgba(255,255,255,.08);
  filter:brightness(1.18);
}
.socials a:hover::after{
  transform:translate(-50%,-50%) scale(1);
}
.socials a:hover i,
.socials a:hover svg,
.socials a:hover img{
  transform:scale(1.12);
  transition:transform .25s ease;
}
.socials a:active{
  transform:translateY(-1px) scale(.98);
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .card-inner { transform: none !important; }
}

/* ============================================================
   ROULETTE FULLSCREEN
   ============================================================ */
.roulette-trigger{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  width:52px;
  height:52px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .25s ease;
  box-shadow:0 8px 26px rgba(0,0,0,.35);
  outline:none;
}
.roulette-trigger:hover{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.3);
  transform:translateY(-2px) scale(1.05);
}
.roulette-trigger svg{
  width:24px;
  height:24px;
  fill:rgba(255,255,255,.85);
  transition:transform .4s ease;
}
.roulette-trigger:hover svg{
  transform:rotate(45deg);
}
.roulette-trigger.active svg{
  transform:rotate(45deg);
}

.roulette-panel{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:9998;
  background:rgba(6,6,10,.86);
  backdrop-filter:blur(32px) saturate(120%);
  -webkit-backdrop-filter:blur(32px) saturate(120%);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:scale(1.02);
  transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1),
             visibility .45s ease, background .5s ease;
  display:flex;
  flex-direction:column;
  padding:24px 40px 20px;
  overflow:hidden;
}
.roulette-panel.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:scale(1);
}

.rp-main{
  flex:1;
  display:grid;
  grid-template-columns: 380px 1fr;
  gap:44px;
  min-height:0;
  align-items:center;
}

.rp-wheel-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.rp-wheel{
  position:relative;
  width:360px;
  height:360px;
}
.rp-wheel-svg{
  width:100%;
  height:100%;
  display:block;
  transition:transform 4.5s cubic-bezier(.16,.8,.2,1);
  transform-origin:50% 50%;
}
.rp-wheel-center{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:64px;height:64px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #f2f2f2, #9a9a9a 70%, #4a4a4a);
  border:2px solid rgba(255,255,255,.25);
  box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.6);
  z-index:2;
}
.rp-wheel-pointer{
  position:absolute;
  top:-10px;left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:18px solid #fff;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  z-index:3;
  transition:border-top-color .5s ease;
}
.rp-wheel-result{
  font-size:15px;
  color:rgba(255,255,255,.55);
  letter-spacing:1px;
  text-align:center;
  min-height:22px;
}
.rp-wheel-result b{
  color:#fff;
  font-weight:600;
  font-size:22px;
}
.rp-spin-btn{
  width:100%;
  max-width:320px;
  padding:15px 0;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
  color:#fff;
  font-size:13px;
  font-weight:600;
  letter-spacing:3px;

.rp-spin-btn:hover{

.rp-table-wrap{

}
.rp-balance{

.balance-float{

@keyframes floatUp{

}

.rp-cell.bet-black{

.rp-cell.side{

   WIN BANNER

  top:50%;
  left:50%;

}
.win-banner .wb-label{

}

@keyframes winBannerPop{

<script>
const CONFIG_URL = './config.js?v=' + Date.now();
const configScript = document.createElement('script');
configScript.src = CONFIG_URL;
configScript.async = false;
configScript.onload = () => render();
configScript.onerror = () => console.error('Не удалось загрузить config.js');
document.head.appendChild(configScript);

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.classList.add('hidden');
});

// ============================================================
// ПАРАЛЛАКС ПРИ ДВИЖЕНИИ МЫШИ
// ============================================================
(function(){
  const cardInner = document.getElementById('cardInner');
  const particlesCanvas = document.getElementById('interactiveParticles');
  const bgCanvas = document.getElementById('bg');

  if (!cardInner) return;

  const isTouch = matchMedia('(hover: none), (pointer: coarse)').matches;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (isTouch || reduced) return;

  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;
  let raf = null;
  let hasEntered = false;

  const CARD_ROT = 8;
  const CARD_SHIFT = 10;
  const BG_SHIFT = 18;

  function onMove(e){
    if (!hasEntered) return;
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    targetX = (e.clientX - cx) / cx;
    targetY = (e.clientY - cy) / cy;
    if (!raf) raf = requestAnimationFrame(update);
  }

  function update(){
    currentX += (targetX - currentX) * 0.12;
    currentY += (targetY - currentY) * 0.12;

    const rotY = currentX * CARD_ROT;
    const rotX = -currentY * CARD_ROT;
    const shiftX = currentX * CARD_SHIFT;
    const shiftY = currentY * CARD_SHIFT;

    cardInner.style.transform =
      `rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg) ` +
      `translate3d(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px, 0)`;

    if (particlesCanvas) {
      particlesCanvas.style.transform =
        `translate3d(${(-currentX * BG_SHIFT).toFixed(2)}px, ${(-currentY * BG_SHIFT).toFixed(2)}px, 0)`;
    }
    if (bgCanvas) {
      bgCanvas.style.transform =
        `translate3d(${(currentX * BG_SHIFT * 0.5).toFixed(2)}px, ${(currentY * BG_SHIFT * 0.5).toFixed(2)}px, 0)`;
    }

    const dx = Math.abs(targetX - currentX);
    const dy = Math.abs(targetY - currentY);
    if (dx > 0.001 || dy > 0.001) {
      raf = requestAnimationFrame(update);
    } else {
      raf = null;
    }
  }

  function resetSmooth(){
    targetX = 0; targetY = 0;
    if (!raf) raf = requestAnimationFrame(update);
  }

  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerleave', resetSmooth);

  const overlayEl = document.getElementById('overlay');
  if (overlayEl) {
    overlayEl.addEventListener('click', () => {
      setTimeout(() => { hasEntered = true; }, 600);
    }, { once: true });
  } else {
    hasEntered = true;
  }
})();

// === ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ===
(function(){
  const toggle = document.getElementById('themeToggle');
  if (!toggle) return;
  const saved = localStorage.getItem('theme');
  if (saved === 'light') document.body.classList.add('light-theme');

  toggle.addEventListener('click', function(e){
    e.stopPropagation();
    document.body.classList.toggle('light-theme');
    const isLight = document.body.classList.contains('light-theme');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    toggle.title = isLight ? 'Тёмная тема' : 'Светлая тема';
  });
})();

// === ОПРЕДЕЛЕНИЕ IP-АДРЕСА ===
(function(){
  const ipBadge = document.getElementById('ipBadge');
  const ipValue = document.getElementById('ipValue');
  if (!ipBadge || !ipValue) return;

  function showBadge(){
    setTimeout(() => ipBadge.classList.add('show'), 900);
  }

  function fetchIP(){
    const sources = [
      { url: 'https://api.ipify.org?format=json', key: 'ip' },
      { url: 'https://ipapi.co/json/',            key: 'ip' },
      { url: 'https://api.ipify.org',             raw: true }
    ];
    let idx = 0;
    function tryNext(){
      if (idx >= sources.length) {
        ipValue.textContent = 'недоступен';
        return;
      }
      const src = sources[idx++];
      fetch(src.url, { cache: 'no-store' })
        .then(r => src.raw ? r.text() : r.json())
        .then(data => {
          const ip = src.raw ? data.trim() : data[src.key];
          if (ip && typeof ip === 'string' && ip.length > 0) {
            ipValue.textContent = ip;
          } else {
            tryNext();
          }
        })
        .catch(() => tryNext());
    }
    tryNext();
  }

  fetchIP();
  showBadge();
})();

// === КАНВАС ФОНА ===
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let w, h, time = 0;
let particles = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  const count = Math.min(180, Math.max(70, Math.floor((w * h) / 12000)));
  particles = Array.from({ length: count }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    r: Math.random() * 1.8 + 0.4,
    a: Math.random() * 0.6 + 0.15,
    phase: Math.random() * Math.PI * 2
  }));
}
resize();
window.addEventListener('resize', resize);

function isLight(){ return document.body.classList.contains('light-theme'); }

function draw() {
  time += 0.006;
  ctx.clearRect(0, 0, w, h);

  const light = isLight();
  const baseCol = light ? '0,0,0' : '255,255,255';

  const glows = [
    { x: w * 0.18 + Math.sin(time * 0.7) * w * 0.08, y: h * 0.25 + Math.cos(time) * h * 0.08, r: Math.max(w,h) * 0.34, a: light ? 0.04 : 0.055 },
    { x: w * 0.82 + Math.cos(time * 0.55) * w * 0.09, y: h * 0.72 + Math.sin(time * 0.8) * h * 0.08, r: Math.max(w,h) * 0.38, a: light ? 0.035 : 0.045 },
    { x: w * 0.52 + Math.sin(time * 0.35) * w * 0.12, y: h * 0.48 + Math.cos(time * 0.6) * h * 0.12, r: Math.max(w,h) * 0.28, a: light ? 0.025 : 0.035 }
  ];

  glows.forEach(g => {
    const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
    grad.addColorStop(0, `rgba(${baseCol},${g.a})`);
    grad.addColorStop(1, `rgba(${baseCol},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  });

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -10) p.x = w + 10;
    if (p.x > w + 10) p.x = -10;
    if (p.y < -10) p.y = h + 10;
    if (p.y > h + 10) p.y = -10;

    const pulse = 0.55 + Math.sin(time * 1.5 + p.phase) * 0.45;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${baseCol},${p.a * pulse})`;
    ctx.fill();
  });

  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 125) {
        const alpha = (1 - dist / 125) * 0.10;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(${baseCol},${alpha})`;
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
  }

  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${baseCol},${0.025 + i * 0.012})`;
    ctx.lineWidth = 1.2;
    for (let x = -80; x <= w + 80; x += 8) {
      const y = h * (0.18 + i * 0.22)
        + Math.sin(x * 0.004 + time * (0.8 + i * 0.12) + i) * (45 + i * 18)
        + Math.sin(x * 0.009 - time * 0.6) * 22;
      if (x === -80) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();

<script>
(function () {
  const music = document.getElementById("bgMusic");
  const button = document.getElementById("soundButton");
  const slider = document.getElementById("volumeSlider");
  if (!music || !button || !slider) return;
  music.volume = 0.30;
  function updateIcon() {
    if (music.paused || music.volume === 0) button.textContent = "🔇";
    else if (music.volume < 0.5) button.textContent = "🔉";
    else button.textContent = "🔊";
  }
  function startMusic() { music.play().catch(() => {}); updateIcon(); }
  document.getElementById("overlay").addEventListener("click", startMusic);
  document.addEventListener("click", startMusic, { once: true });
  button.addEventListener("click", function (event) {
    event.stopPropagation();
    if (music.paused) music.play().catch(() => {});
    else music.pause();
    updateIcon();
  });
  slider.addEventListener("input", function () {
    music.volume = Number(this.value);
    if (music.volume > 0 && music.paused === false) {
      button.textContent = music.volume < 0.5 ? "🔉" : "🔊";
    } else if (music.volume === 0) {
      button.textContent = "🔇";
    }
  });
  music.addEventListener("ended", function () { button.textContent = "🔇"; });
  updateIcon();
})();
</script>

<script>
(function(){
  function revealPage(){ document.body.classList.add("page-ready"); }
  const overlay = document.getElementById("overlay");
  if (overlay) {
    overlay.addEventListener("click", function(){ setTimeout(revealPage, 120); }, {once:true});
  } else {
    requestAnimationFrame(revealPage);
  }

  const canvas = document.getElementById("interactiveParticles");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  let w = 0, h = 0, dpr = 1;
  let particles = [];
  const mouse = {x:-9999, y:-9999, active:false};

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.floor(w*dpr);
    canvas.height = Math.floor(h*dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.min(115, Math.max(45, Math.floor((w*h)/15000)));
    particles = Array.from({length:count}, () => ({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35,
      r:Math.random()*1.5+.6
    }));
  }
  function move(e){ mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; }
  window.addEventListener("resize", resize);
  window.addEventListener("pointermove", move, {passive:true});
  window.addEventListener("pointerleave", ()=>mouse.active=false);

  function frame(){
    ctx.clearRect(0,0,w,h);
    const light = document.body.classList.contains('light-theme');
    const col = light ? '0,0,0' : '255,255,255';
    const alpha = light ? .5 : .62;

    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < -20) p.x = w+20;
      if(p.x > w+20) p.x = -20;
      if(p.y < -20) p.y = h+20;
      if(p.y > h+20) p.y = -20;
      if(mouse.active){
        const dx = p.x-mouse.x, dy = p.y-mouse.y;
        const dist = Math.hypot(dx,dy);
        const radius = 125;
        if(dist < radius && dist > 0){
          const force = (1-dist/radius) * .55;
          p.x += (dx/dist)*force;
          p.y += (dy/dist)*force;
        }
      }
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${col},${alpha})`;
      ctx.fill();
    }
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a=particles[i], b=particles[j];
        const dx=a.x-b.x, dy=a.y-b.y;
        const dist=Math.hypot(dx,dy);
        if(dist < 115){
          const al=(1-dist/115)*.14;
          ctx.strokeStyle=`rgba(${col},${al})`;
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }
    // Свечение вокруг курсора убрано
    requestAnimationFrame(frame);
  }
  resize();
  frame();
})();
</script>

  const payoutEl = document.getElementById('payoutEl');
  const betTable = document.getElementById('betTable');
  const winBanner = document.getElementById('winBanner');
  const wbEmoji = document.getElementById('wbEmoji');
  const wbLabel = document.getElementById('wbLabel');
  const wbAmount = document.getElementById('wbAmount');
  const wbNumber = document.getElementById('wbNumber');

  if (!panel || !trigger) return;

  const WHEEL_ORDER = [
    0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5,
    24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
  ];
  const RED_NUMBERS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const BLACK_NUMBERS = new Set([2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35]);

  function numberColor(n){
    if (n === 0 || n === '00') return '#1f8a4c';
    return RED_NUMBERS.has(n) ? '#b0232d' : '#141418';
  }

  function buildWheel(){
    const cx = 100, cy = 100;
    const rOuter = 92, rInner = 62;
    const segments = WHEEL_ORDER.length;
    const angleStep = (Math.PI * 2) / segments;
    let html = '';
    html += `<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>`;
    WHEEL_ORDER.forEach((num, i) => {
      const start = -Math.PI / 2 + i * angleStep - angleStep / 2;
      const end = start + angleStep;
      const x1 = cx + rInner * Math.cos(start), y1 = cy + rInner * Math.sin(start);
      const x2 = cx + rOuter * Math.cos(start), y2 = cy + rOuter * Math.sin(start);
      const x3 = cx + rOuter * Math.cos(end),   y3 = cy + rOuter * Math.sin(end);
      const x4 = cx + rInner * Math.cos(end),   y4 = cy + rInner * Math.sin(end);
      const large = angleStep > Math.PI ? 1 : 0;
      const mid = start + angleStep / 2;
      const textR = (rInner + rOuter) / 2;
      const tx = cx + textR * Math.cos(mid);
      const ty = cy + textR * Math.sin(mid);
      const color = numberColor(num);
      html += `<path d="M${x1} ${y1} L${x2} ${y2} A${rOuter} ${rOuter} 0 ${large} 1 ${x3} ${y3} L${x4} ${y4} A${rInner} ${rInner} 0 ${large} 0 ${x1} ${y1} Z"
        fill="${color}" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>`;
      html += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central"
        font-size="7.5" font-weight="700" fill="#fff" transform="rotate(${(mid * 180 / Math.PI) + 90} ${tx} ${ty})"
        style="paint-order:stroke;stroke:rgba(0,0,0,0.45);stroke-width:1.2px">${num}</text>`;
    });
    html += `<circle cx="${cx}" cy="${cy}" r="${rInner}" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>`;
    wheelSvg.innerHTML = html;
  }
  buildWheel();

  CELLS.push({ label: '',   type: 'empty',                            row: 4, col: '5 / span 4' });

    if (isWin) {
      wbEmoji.textContent = '🎉';
      wbLabel.textContent = 'Выигрыш';
      wbAmount.textContent = '+' + amount.toLocaleString('ru-RU') + ' ₽';
      winBanner.classList.add('show');
      spawnSparks();
    } else {
      wbEmoji.textContent = '😔';
      wbLabel.textContent = 'Проигрыш';
      wbAmount.textContent = '−' + amount.toLocaleString('ru-RU') + ' ₽';
      winBanner.classList.add('lose');
      winBanner.classList.add('show');
    }

    if (winNumber !== undefined) {
      wbNumber.innerHTML = `Выпало: <b>${winNumber}</b>`;
    } else {
      wbNumber.innerHTML = '';
    }

    setTimeout(() => winBanner.classList.remove('show', 'lose'), 2500);
  }

  function spawnSparks(){
    const count = 28;
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < count; i++) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const dist = 140 + Math.random() * 220;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      spark.style.left = cx + 'px';
      spark.style.top = cy + 'px';
      spark.style.setProperty('--dx', dx + 'px');
      spark.style.setProperty('--dy', dy + 'px');
      spark.style.animationDelay = (Math.random() * 0.15) + 's';
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 1600);
    }
  }

  function renderTable(){
    betTable.innerHTML = '';
    CELLS.forEach((c, idx) => {
      const div = document.createElement('div');
      div.className = 'rp-cell';
      div.style.gridRow = c.row;
      div.style.gridColumn = c.col;
      if (c.side) div.classList.add('side');
      if (c.green) div.classList.add('green');
      else if (typeof c.value === 'number' && c.type === 'number') {
        div.classList.add(RED_NUMBERS.has(c.value) ? 'red' : 'black');
      }
      if (c.betColor === 'red') div.classList.add('bet-red');
      if (c.betColor === 'black') div.classList.add('bet-black');
      if (c.type === 'empty') div.classList.add('empty');

      if (c.betColor) {
        div.innerHTML = `<span class="dot"></span>`;
      } else {
        div.textContent = c.label;
      }

      div.dataset.idx = idx;

      if (c.type !== 'empty') {
        div.addEventListener('click', (e) => { e.preventDefault(); placeBet(idx); });
        div.addEventListener('contextmenu', (e) => { e.preventDefault(); removeBet(idx); });
      }
      betTable.appendChild(div);
    });
    updateBalance();
    updateBetInfo();
  }

  function placeBet(cellIdx){
    const cell = CELLS[cellIdx];
    if (!cell || cell.type === 'empty') return;
    const amount = 10;
    if (balance < amount) return;
    balance -= amount; currentBet += amount;
    const existing = bets.find(b => b.cellIdx === cellIdx);
    if (existing) existing.amount += amount;
    else bets.push({ cellIdx, type: cell.type, value: cell.value, amount });
    const el = betTable.querySelector(`[data-idx="${cellIdx}"]`);
    if (el) {
      let chip = el.querySelector('.rp-chip');
      if (!chip) { chip = document.createElement('div'); chip.className = 'rp-chip'; el.appendChild(chip); }
    }
    updateBalance(); updateBetInfo();
  }

  function removeBet(cellIdx){
    const idx = bets.findIndex(b => b.cellIdx === cellIdx);
    if (idx === -1) return;
    const bet = bets[idx];
    balance += bet.amount; currentBet -= bet.amount;
    bets.splice(idx, 1);
    const el = betTable.querySelector(`[data-idx="${cellIdx}"]`);
    if (el) { const chip = el.querySelector('.rp-chip'); if (chip) chip.remove(); }
    updateBalance(); updateBetInfo();
  }

  renderTable();

  let spinning = false, currentRotation = 0;

  function spin(){
    if (spinning) return;
    if (bets.length === 0) { resultEl.textContent = 'Сначала сделайте ставку'; return; }
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = 'Крутится...';

    const winIndex = Math.floor(Math.random() * WHEEL_ORDER.length);
    const winNumber = WHEEL_ORDER[winIndex];
    const angleStep = 360 / WHEEL_ORDER.length;
    const targetAngle = 360 * 5 + (360 - (winIndex * angleStep));
    currentRotation += targetAngle;
    wheelSvg.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      spinBtn.disabled = false;
      resultEl.innerHTML = `Выпало: <b>${winNumber}</b>`;
      calculatePayout(winNumber);
    }, 4700);
  }

  function calculatePayout(winNumber){
    let payout = 0;
    const wonCells = [];

    bets.forEach(bet => {
      let win = false, multiplier = 0;
      switch (bet.type) {
        case 'number':
          if (String(bet.value) === String(winNumber)) { win = true; multiplier = 36; }
          break;
        case 'red':
          if (typeof winNumber === 'number' && RED_NUMBERS.has(winNumber)) { win = true; multiplier = 2; }
          break;
        case 'black':
          if (typeof winNumber === 'number' && BLACK_NUMBERS.has(winNumber)) { win = true; multiplier = 2; }
          break;
        case 'even':
          if (typeof winNumber === 'number' && winNumber !== 0 && winNumber % 2 === 0) { win = true; multiplier = 2; }
          break;
        case 'odd':
          if (typeof winNumber === 'number' && winNumber !== 0 && winNumber % 2 !== 0) { win = true; multiplier = 2; }
          break;
        case 'low':
          if (typeof winNumber === 'number' && winNumber >= 1 && winNumber <= 18) { win = true; multiplier = 2; }
          break;
        case 'high':
          if (typeof winNumber === 'number' && winNumber >= 19 && winNumber <= 36) { win = true; multiplier = 2; }
          break;
        case 'dozen':
          if (typeof winNumber === 'number' && winNumber !== 0) {
            const d = Math.ceil(winNumber / 12);
            if (d === bet.value) { win = true; multiplier = 3; }
          }
          break;
        case 'column':
          if (typeof winNumber === 'number' && winNumber !== 0) {
            const col = ((winNumber - 1) % 3) + 1;
            if (col === bet.value) { win = true; multiplier = 3; }
          }
          break;
      }
      if (win) {
        const winAmount = bet.amount * multiplier;
        payout += winAmount;
        wonCells.push(bet.cellIdx);
      }
    });

    const totalBet = currentBet;

    if (payout > 0) {
      balance += payout;
      updateBalance();
      payoutEl.textContent = payout;
      payoutEl.classList.add('win');
      setTimeout(() => payoutEl.classList.remove('win'), 1500);
      flashBalance(true);
      showFloat(payout, true);
      showWinBanner(true, payout, winNumber);
      wonCells.forEach(idx => {
        const el = betTable.querySelector(`[data-idx="${idx}"]`);
        if (el) {
          el.classList.add('win-glow');
          setTimeout(() => el.classList.remove('win-glow'), 1700);
        }
      });
    } else {
      payoutEl.textContent = '0';
      flashBalance(false);
      if (totalBet > 0) {
        showFloat(totalBet, false);
        showWinBanner(false, totalBet, winNumber);
      }
    }

    bets.length = 0; currentBet = 0;
    betTable.querySelectorAll('.rp-chip').forEach(ch => ch.remove());
    updateBetInfo();
  }

  spinBtn.addEventListener('click', spin);

  function toggleRoulette(){
    const isOpen = panel.classList.toggle('open');
    trigger.classList.toggle('active', isOpen);
  }

  trigger.addEventListener('click', toggleRoulette);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      panel.classList.remove('open');
      trigger.classList.remove('active');
    }
  });
})();
</script>
